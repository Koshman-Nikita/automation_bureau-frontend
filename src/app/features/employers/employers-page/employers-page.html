<div class="page">
  <!-- Header -->
  <div class="header mat-elevation-z1">
    <div class="left">
      <button mat-stroked-button routerLink="/dashboard">
        <mat-icon>arrow_back</mat-icon>
        <span>Назад</span>
      </button>
      <h2 class="title">Роботодавці</h2>
    </div>

    <div class="right">
      <mat-form-field appearance="outline" class="search">
        <mat-label>Пошук</mat-label>
        <input
          matInput
          [(ngModel)]="q"
          (keyup.enter)="search()"
          placeholder="назва / вид діяльності / телефон / місто / адреса"
        />
        <button *ngIf="q" matSuffix mat-icon-button aria-label="clear" (click)="q=''; search()">
          <mat-icon>clear</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon>&nbsp;Додати
      </button>
    </div>
  </div>

  <!-- Body -->
  <div class="content" *ngIf="!loading; else busy">
    <div class="table-card mat-elevation-z1">
      <table mat-table [dataSource]="items" class="w-100">

        <!-- Назва -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Назва</th>
          <td mat-cell *matCellDef="let r">{{ r.name }}</td>
        </ng-container>

        <!-- Вид діяльності -->
        <ng-container matColumnDef="activityType">
          <th mat-header-cell *matHeaderCellDef>Вид діяльності</th>
          <td mat-cell *matCellDef="let r">{{ r.activityType || '—' }}</td>
        </ng-container>

        <!-- Телефон -->
        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef>Телефон</th>
          <td mat-cell *matCellDef="let r">{{ r.phone || '—' }}</td>
        </ng-container>

        <!-- Адреса (Місто, Адреса) -->
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Адреса</th>
          <td mat-cell *matCellDef="let r">
            {{ (r.city ? r.city + (r.address ? ', ' : '') : '') + (r.address || '—') }}
          </td>
        </ng-container>

        <!-- Дії -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="col-actions"></th>
          <td mat-cell *matCellDef="let r" class="col-actions">
            <button mat-icon-button color="primary" matTooltip="Редагувати" (click)="edit(r)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Видалити" (click)="remove(r)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="cols"></tr>
        <tr mat-row *matRowDef="let row; columns: cols"></tr>

        <tr class="empty" *ngIf="(items || []).length === 0">
          <td [attr.colspan]="cols.length">
            <div class="empty-box">
              <mat-icon>inbox</mat-icon>
              <div>Нічого не знайдено</div>
              <small>Спробуйте змінити запит або додати запис</small>
            </div>
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="total"
      [pageIndex]="page - 1"
      [pageSize]="limit"
      [pageSizeOptions]="[5,10,20,50]"
      (page)="pageChange($event)">
    </mat-paginator>
  </div>

  <ng-template #busy>
    <div class="busy">
      <mat-spinner diameter="36"></mat-spinner>
    </div>
  </ng-template>
</div>
