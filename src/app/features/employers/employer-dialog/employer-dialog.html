<form [formGroup]="form" (ngSubmit)="save()">
  <h2 mat-dialog-title class="dialog-title">
    {{ data?._id ? 'Редагувати роботодавця' : 'Новий роботодавець' }}
  </h2>

  <mat-dialog-content class="content">
    <div class="grid">
      <!-- Назва -->
      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Назва*</mat-label>
        <input matInput formControlName="name" />
        <mat-error *ngIf="f.name.hasError('required')">Вкажіть назву</mat-error>
        <mat-error *ngIf="f.name.hasError('minlength')">Мінімум 2 символи</mat-error>
      </mat-form-field>

      <!-- Вид діяльності (autocomplete) -->
      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Вид діяльності</mat-label>
        <input
          matInput
          formControlName="activityType"
          [matAutocomplete]="actAuto"
          #actTrigger="matAutocompleteTrigger"
          (focus)="actTrigger.openPanel()"
          autocomplete="off"
          aria-label="Вид діяльності"
        />
        <button
          *ngIf="form.get('activityType')?.value"
          matSuffix
          mat-icon-button
          type="button"
          aria-label="Очистити"
          (click)="form.get('activityType')?.setValue('')">
          <mat-icon>clear</mat-icon>
        </button>
        <mat-autocomplete #actAuto="matAutocomplete" autoActiveFirstOption>
          <mat-option *ngFor="let t of (filteredActivityTypes$ | async) ?? []" [value]="t.name">
            {{ t.name }}
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <!-- Телефон -->
      <mat-form-field appearance="outline">
        <mat-label>Телефон</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>

      <!-- Місто (НОВЕ окреме поле) -->
      <mat-form-field appearance="outline">
        <mat-label>Місто</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>

      <!-- Адреса -->
      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Адреса</mat-label>
        <input matInput formControlName="address" />
      </mat-form-field>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="actions">
    <button type="button" mat-stroked-button (click)="cancel()" [disabled]="loading">
      Скасувати
    </button>
    <button type="submit" mat-raised-button color="primary" [disabled]="form.invalid || loading">
      {{ loading ? 'Збереження…' : (data?._id ? 'Зберегти' : 'Створити') }}
    </button>
  </mat-dialog-actions>
</form>
