<form class="dialog-form" [formGroup]="form" (ngSubmit)="save()">
  <h2 class="dialog-title">{{ data?._id ? 'Редагування угоди' : 'Нова угода' }}</h2>

  <div class="grid-2">
    <mat-form-field appearance="outline">
      <mat-label>ID роботодавця</mat-label>
      <input matInput formControlName="employerId">
      <mat-error *ngIf="f.employerId.hasError('required')">Обовʼязково</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>ID пошукача</mat-label>
      <input matInput formControlName="jobseekerId">
      <mat-error *ngIf="f.jobseekerId.hasError('required')">Обовʼязково</mat-error>
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Посада</mat-label>
    <input matInput formControlName="position">
    <mat-error *ngIf="f.position.hasError('required')">Обовʼязково</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Комісійні, %</mat-label>
    <input matInput type="number" formControlName="feePercent">
  </mat-form-field>

  <div class="actions">
    <button mat-stroked-button type="button" (click)="cancel()" [disabled]="loading">Скасувати</button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Збереження…' : (data?._id ? 'Зберегти' : 'Створити') }}
    </button>
  </div>
</form>
