<h2 mat-dialog-title>{{ data?._id ? 'Редагувати вакансію' : 'Нова вакансія' }}</h2>

<mat-dialog-content [formGroup]="form">
  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Роботодавець</mat-label>
    <input matInput formControlName="employerId" placeholder="ID роботодавця">
    <mat-error *ngIf="f.employerId.hasError('required')">Обовʼязково</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Посада / назва вакансії</mat-label>
    <input matInput formControlName="title" placeholder="Напр.: QA Engineer">
    <mat-error *ngIf="f.title.hasError('required')">Обовʼязково</mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Тип діяльності</mat-label>
    <input matInput formControlName="activityType" placeholder="Напр.: testing">
    <mat-error *ngIf="f.activityType.hasError('required')">Обовʼязково</mat-error>
  </mat-form-field>

  <div class="row">
    <mat-form-field appearance="outline" class="w-50 pr-8">
      <mat-label>Зарплата від</mat-label>
      <input matInput type="number" formControlName="salaryFrom">
    </mat-form-field>

    <mat-form-field appearance="outline" class="w-50">
      <mat-label>Зарплата до</mat-label>
      <input matInput type="number" formControlName="salaryTo">
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Нотатки</mat-label>
    <textarea matInput formControlName="notes" rows="3"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Скасувати</button>
  <button mat-flat-button color="primary" (click)="save()" [disabled]="loading">
    {{ loading ? 'Збереження…' : 'Зберегти' }}
  </button>
</mat-dialog-actions>
