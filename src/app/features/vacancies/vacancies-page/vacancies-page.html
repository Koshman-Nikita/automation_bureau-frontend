<div class="page">
  <!-- Header -->
  <div class="header">
    <div class="left">
      <button mat-stroked-button type="button" (click)="back()">
        <mat-icon>arrow_back</mat-icon>&nbsp;Назад
      </button>
      <h1 class="title">Вакансії</h1>
    </div>

    <div class="right">
      <mat-form-field appearance="outline" class="search">
        <mat-label>Пошук</mat-label>
        <input
          matInput
          [(ngModel)]="q"
          (keyup.enter)="search()"
          autocomplete="off"
          placeholder="Пошук"
        />
        <button
          *ngIf="q"
          matSuffix
          mat-icon-button
          type="button"
          aria-label="Очистити"
          (click)="q=''; search()"
        >
          <mat-icon>clear</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" type="button" (click)="add()">
        <mat-icon>add</mat-icon>&nbsp;Додати
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="content" *ngIf="!loading; else busy">
    <table mat-table [dataSource]="items" class="w-100">
      <!-- title -->
      <ng-container matColumnDef="title">
        <th mat-header-cell *matHeaderCellDef>Посада</th>
        <td mat-cell *matCellDef="let r">{{ r.title || '—' }}</td>
      </ng-container>

      <!-- employer -->
      <ng-container matColumnDef="employer">
        <th mat-header-cell *matHeaderCellDef>Компанія</th>
        <td mat-cell *matCellDef="let r">{{ employerName(r) }}</td>
      </ng-container>

      <!-- activityType -->
      <ng-container matColumnDef="activityType">
        <th mat-header-cell *matHeaderCellDef>Тип діяльності</th>
        <td mat-cell *matCellDef="let r">{{ r.activityType || '—' }}</td>
      </ng-container>

      <!-- salary -->
      <ng-container matColumnDef="salary">
        <th mat-header-cell *matHeaderCellDef>Зарплата</th>
        <td mat-cell *matCellDef="let r">{{ salary(r) }}</td>
      </ng-container>

      <!-- status -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Статус</th>
        <td mat-cell *matCellDef="let r">{{ r.status || '—' }}</td>
      </ng-container>

      <!-- skills -->
      <ng-container matColumnDef="skills">
        <th mat-header-cell *matHeaderCellDef>Навички</th>
        <td mat-cell *matCellDef="let r">{{ skillsStr(r) }}</td>
      </ng-container>

      <!-- actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="col-actions"></th>
        <td mat-cell *matCellDef="let r" class="col-actions">
          <button mat-icon-button matTooltip="Редагувати" (click)="edit(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Видалити" (click)="remove(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols"></tr>

      <tr class="empty" *ngIf="(items || []).length === 0">
        <td colspan="7">
          <div class="empty-box">
            <mat-icon>inbox</mat-icon>
            Немає даних
          </div>
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="total"
      [pageIndex]="page - 1"
      [pageSize]="limit"
      [pageSizeOptions]="[10,20,50]"
      (page)="pageChange($event)">
    </mat-paginator>
  </div>

  <ng-template #busy>
    <div class="busy"><mat-spinner diameter="36"></mat-spinner></div>
  </ng-template>
</div>
