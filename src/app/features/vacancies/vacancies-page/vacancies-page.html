<div class="table-wrap" *ngIf="!loading; else busy">
  <div class="toolbar">
    <button mat-flat-button color="primary" (click)="add()">
      <mat-icon>add</mat-icon> Додати
    </button>

    <span class="spacer"></span>

    <mat-form-field appearance="outline" style="width:260px">
      <mat-label>Пошук</mat-label>
      <input matInput [(ngModel)]="q" (keyup.enter)="search()">
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="items()" class="mat-elevation-z1 w-100">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Посада </th>
      <td mat-cell *matCellDef="let r"> {{ r.title }} </td>
    </ng-container>

    <ng-container matColumnDef="employerId">
      <th mat-header-cell *matHeaderCellDef> Роботодавець </th>
      <td mat-cell *matCellDef="let r"> {{ r.employerId }} </td>
    </ng-container>

    <ng-container matColumnDef="activityType">
      <th mat-header-cell *matHeaderCellDef> Тип </th>
      <td mat-cell *matCellDef="let r"> {{ r.activityType }} </td>
    </ng-container>

    <ng-container matColumnDef="salary">
      <th mat-header-cell *matHeaderCellDef> Зарплата </th>
      <td mat-cell *matCellDef="let r"> {{ salary(r) }} </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let r">
        <button mat-icon-button (click)="edit(r)"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="remove(r)"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <mat-paginator [length]="total()" [pageIndex]="page()-1" [pageSize]="limit()"
                 [pageSizeOptions]="[5,10,20,50]" (page)="pageChange($event)">
  </mat-paginator>
</div>

<ng-template #busy>
  <div class="busy"><mat-spinner diameter="36"></mat-spinner></div>
</ng-template>
