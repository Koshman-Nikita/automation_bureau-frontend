<form class="dialog-form" [formGroup]="form" (ngSubmit)="save()" role="form">
  <h2 class="dialog-title">
    {{ (data && data._id) ? 'Редагування виду діяльності' : 'Новий вид діяльності' }}
  </h2>

  <mat-form-field appearance="outline" class="w-100">
    <mat-label>Назва</mat-label>
    <input
      matInput
      formControlName="name"
      placeholder="Interview scheduled"
      title="Назва виду діяльності"
      autofocus
    />
    <mat-hint>Мінімум 2 символи</mat-hint>
    <mat-error *ngIf="f.name.hasError('required')">Вкажіть назву</mat-error>
    <mat-error *ngIf="f.name.hasError('minlength')">Занадто коротка назва</mat-error>
  </mat-form-field>

  <mat-checkbox formControlName="isActive">Активний</mat-checkbox>

  <div class="actions">
    <button mat-stroked-button type="button" (click)="cancel()" [disabled]="loading">
      Скасувати
    </button>
    <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid || loading">
      {{ loading ? 'Збереження…' : (data?._id ? 'Зберегти' : 'Створити') }}
    </button>
  </div>
</form>
