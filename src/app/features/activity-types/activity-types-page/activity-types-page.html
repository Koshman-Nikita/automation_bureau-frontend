<div class="page">
  <div class="header">
    <div class="left">
      <button mat-stroked-button (click)="back()">
        <mat-icon>arrow_back</mat-icon>&nbsp;Назад
      </button>
      <h1 class="title">Види діяльності</h1>
    </div>

    <div class="right">
      <mat-form-field appearance="outline" class="search">
        <mat-label>Пошук</mat-label>
        <input matInput [(ngModel)]="q" (keyup.enter)="search()">
        <button *ngIf="q" matSuffix mat-icon-button aria-label="clear" (click)="q=''; search()">
          <mat-icon>clear</mat-icon>
        </button>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="add()">
        <mat-icon>add</mat-icon>&nbsp;Додати
      </button>
    </div>
  </div>

  <div class="content" *ngIf="!loading; else busy">
    <table mat-table [dataSource]="items" class="w-100 table-card">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Назва</th>
        <td mat-cell *matCellDef="let r">{{ r.name || '—' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="col-actions"></th>
        <td mat-cell *matCellDef="let r" class="col-actions">
          <button mat-icon-button matTooltip="Редагувати" (click)="edit(r)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Видалити" (click)="remove(r)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="cols"></tr>
      <tr mat-row *matRowDef="let row; columns: cols"></tr>

      <tr class="empty" *ngIf="(items || []).length === 0">
        <td colspan="2">
          <div class="empty-box">
            <mat-icon>inbox</mat-icon>
            Немає даних
          </div>
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="total"
      [pageIndex]="page - 1"
      [pageSize]="limit"
      [pageSizeOptions]="[10,20,50]"
      (page)="pageChange($event)">
    </mat-paginator>
  </div>

  <ng-template #busy>
    <div class="busy"><mat-spinner diameter="36"></mat-spinner></div>
  </ng-template>
</div>
