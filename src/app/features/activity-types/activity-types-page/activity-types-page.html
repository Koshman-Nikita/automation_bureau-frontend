<div class="page">
  <div class="toolbar">
    <button mat-raised-button color="primary" (click)="openCreate()">
      <mat-icon>add</mat-icon>&nbsp;Додати вид діяльності
    </button>

    <span class="spacer"></span>

    <mat-form-field appearance="outline" class="search">
      <mat-label>Пошук</mat-label>
      <input matInput [(ngModel)]="q" (ngModelChange)="reload()" />
    </mat-form-field>
  </div>

  <table mat-table [dataSource]="items()">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Назва</th>
      <td mat-cell *matCellDef="let it">{{ it.name }}</td>
    </ng-container>

    <ng-container matColumnDef="isActive">
      <th mat-header-cell *matHeaderCellDef>Активний</th>
      <td mat-cell *matCellDef="let it">{{ it.isActive ? 'так' : 'ні' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="w-actions">Дії</th>
      <td mat-cell *matCellDef="let it">
        <button mat-button (click)="openEdit(it)">Редагувати</button>
        <button mat-button color="warn" (click)="remove(it)">Видалити</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols;"></tr>
  </table>

  <mat-paginator
    [length]="total()"
    [pageIndex]="page() - 1"
    [pageSize]="limit()"
    (page)="onPage($event)">
  </mat-paginator>
</div>
