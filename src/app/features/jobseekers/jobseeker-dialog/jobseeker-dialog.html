<form [formGroup]="form" (ngSubmit)="save()" autocomplete="off">
  <h2 mat-dialog-title class="dialog-title">
    {{ data?._id ? 'Редагувати пошукача' : 'Новий пошукач' }}
  </h2>

  <mat-dialog-content class="content">
    <div class="grid">
      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>ПІБ**</mat-label>
        <input matInput formControlName="fullName" />
        <mat-hint>Мінімум 2 символи</mat-hint>
      </mat-form-field>

      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Кваліфікація**</mat-label>
        <input matInput formControlName="qualification" />
      </mat-form-field>

      <!-- Вид діяльності (довідник + пошук) -->
      <mat-form-field appearance="outline" class="col-span-2">
        <mat-label>Вид діяльності</mat-label>
        <input
          matInput
          formControlName="activityType"
          [matAutocomplete]="actAuto"
          (focus)="openActivityPanel()"
        />
        <mat-autocomplete #actAuto="matAutocomplete" (optionSelected)="onActivitySelected($event)">
          <mat-option *ngFor="let t of activityTypes" [value]="t.name">
            {{ t.name }}
          </mat-option>
          <mat-option *ngIf="(activityTypes || []).length === 0" disabled>
            Нічого не знайдено
          </mat-option>
        </mat-autocomplete>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Місто</mat-label>
        <input matInput formControlName="city" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Очікувана ЗП</mat-label>
        <input matInput type="number" formControlName="salaryDesired" />
      </mat-form-field>

      <div class="col-span-2">
        <label class="mb-1 block">Статус</label>
        <mat-radio-group formControlName="status">
          <mat-radio-button value="searching">пошук роботи</mat-radio-button>
          <mat-radio-button value="employed" class="ml-4">працює</mat-radio-button>
        </mat-radio-group>
      </div>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="actions">
    <button type="button" mat-stroked-button (click)="cancel()" [disabled]="loading">
      Скасувати
    </button>
    <button type="submit" mat-raised-button color="primary" [disabled]="form.invalid || loading">
      Зберегти
    </button>
  </mat-dialog-actions>
</form>
