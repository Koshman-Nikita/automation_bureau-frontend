<div class="header">
  <h2>Пошукачі</h2>
  <div class="tools">
    <mat-form-field appearance="outline" class="search">
      <mat-label>Пошук</mat-label>
      <input matInput [(ngModel)]="q" (keyup.enter)="search()" placeholder="ПІБ / вид діяльності / кваліфікація">
    </mat-form-field>
    <button mat-raised-button color="primary" (click)="add()"><mat-icon>add</mat-icon>&nbsp;Додати</button>
  </div>
</div>

<div class="table-wrap" *ngIf="!loading; else busy">
  <table mat-table [dataSource]="items" class="mat-elevation-z1 w-100">
    <ng-container matColumnDef="fullName">
      <th mat-header-cell *matHeaderCellDef>ПІБ</th>
      <td mat-cell *matCellDef="let r">{{ fullName(r) }}</td>
    </ng-container>

    <ng-container matColumnDef="activityType">
      <th mat-header-cell *matHeaderCellDef>Вид діяльності</th>
      <td mat-cell *matCellDef="let r">{{ r.activityType }}</td>
    </ng-container>

    <ng-container matColumnDef="desiredSalary">
      <th mat-header-cell *matHeaderCellDef>Очік. ЗП</th>
      <td mat-cell *matCellDef="let r">{{ r.desiredSalary || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="qualification">
      <th mat-header-cell *matHeaderCellDef>Кваліфікація</th>
      <td mat-cell *matCellDef="let r">{{ r.qualification || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="col-actions"></th>
      <td mat-cell *matCellDef="let r" class="col-actions">
        <button mat-icon-button color="primary" (click)="edit(r)" matTooltip="Редагувати"><mat-icon>edit</mat-icon></button>
        <button mat-icon-button color="warn" (click)="remove(r)" matTooltip="Видалити"><mat-icon>delete</mat-icon></button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let row; columns: cols"></tr>
  </table>

  <mat-paginator [length]="total" [pageIndex]="page-1" [pageSize]="limit" [pageSizeOptions]="[5,10,20,50]" (page)="pageChange($event)"></mat-paginator>
</div>

<ng-template #busy><div class="busy"><mat-spinner diameter="36"></mat-spinner></div></ng-template>
